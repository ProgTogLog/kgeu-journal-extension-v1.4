<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Журнал преподавателя</title>
<style>
:root{--blue:#2856d8;--ink:#182640;--muted:#68778d;--line:#dfe6f1;--bg:#f3f6fb;--card:#fff;--red:#b54131;--green:#19766f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:600}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff1ee;color:var(--red);border:1px solid #ffd8d0}button.small{padding:7px 9px;font-size:13px}.top{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:700;display:flex;align-items:center;gap:11px}.logo{background:var(--blue);color:white;width:37px;height:37px;border-radius:10px;display:grid;place-items:center}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);max-width:1650px;margin:auto}.side{min-height:calc(100vh - 72px);padding:27px 15px;border-right:1px solid var(--line);background:#f9fbff}.side h4,.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 10px 12px}.group{width:100%;display:flex;text-align:left;align-items:center;gap:10px;background:transparent;color:var(--ink);padding:12px;margin-bottom:5px}.group.active{background:#e7efff;color:#214cb6}.group span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.course{margin:30px 5px 0;padding:17px;border-radius:11px;background:#192e55;color:#fff}.course p{font-size:13px;line-height:1.7;color:#c5d1e9;margin:9px 0}.main{padding:30px;min-width:0}.title{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.title h1{font-size:30px;margin:0}.title p{margin:7px 0;color:var(--muted)}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:25px 0 20px;overflow:auto}.tab{background:transparent;color:#52627b;padding:13px 2px;border-radius:0;white-space:nowrap}.tab.active{color:var(--blue);border-bottom:2px solid var(--blue)}.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:11px}.stat{padding:18px}.stat span{color:var(--muted);font-size:13px}.stat b{font-size:30px;display:block;margin-top:16px}.stat small{font-size:12px;color:var(--muted);display:block;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.card h2{font-size:17px;margin:0;padding:18px;border-bottom:1px solid #edf1f6}.item{display:flex;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid #edf1f6}.item small{display:block;color:var(--muted);margin-top:6px}.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 16px}.tools-left{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.panel{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:12px 13px;border-bottom:1px solid #edf1f6;text-align:left;font-size:14px}th{background:#f8faff;color:#5c6d85;font-weight:600;font-size:12px}td input,td select{width:100%;min-width:80px;border:1px solid var(--line);border-radius:6px;padding:7px;background:white}.grade{min-width:42px;padding:7px;background:#fff;color:#78869b;border:1px solid var(--line)}.grade.has{color:#1e50c7;background:#e8efff;border-color:#d5e0fb}.grade.debt{color:var(--red);background:#fff1ee;border-color:#ffd8d0}.right{text-align:right}.notice{padding:15px;border:1px dashed #cbd8ed;border-radius:10px;color:#506991;line-height:1.55}.empty{padding:35px;color:var(--muted);text-align:center}.modal{position:fixed;inset:0;background:#17244099;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.dialog{width:min(610px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;padding:23px}.dialog h2{margin:0 0 8px}.dialog p{color:var(--muted);line-height:1.55}.field{display:block;margin-top:14px;color:#3f4f68;font-weight:600;font-size:13px}.field input,.field select,.field textarea{display:block;margin-top:7px;width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;font-weight:400}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.check{display:flex;gap:8px;align-items:center;margin-top:14px;color:#3f4f68;font-size:14px}.check input{width:auto;margin:0}.hint{font-size:13px;color:var(--muted);line-height:1.55}.alert{margin-bottom:15px;padding:12px;border-radius:8px;background:#fff0ed;color:var(--red);display:none}.scorebox{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:#f0f5fe;border-radius:9px;padding:12px;margin-top:14px}.scorebox span{display:block;color:#61738e;font-size:12px}.scorebox b{display:block;color:var(--blue);font-size:23px;margin-top:6px}.hide{display:none!important}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{min-height:0;display:flex;gap:8px;padding:12px;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side h4,.course{display:none}.group{min-width:145px;margin:0}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.main{padding:22px 15px}}@media(max-width:520px){.top{padding:0 14px}.top .top-actions button:first-child{display:none}.title{flex-direction:column}.stats{gap:10px}.stat{padding:14px}.stat b{font-size:25px}.row{grid-template-columns:1fr}.main{padding:20px 12px}.scorebox{grid-template-columns:repeat(2,1fr);gap:12px}}
.active-filter{background:#e7efff!important;color:#214cb6!important;border-color:#cddafd!important}
</style></head>
<body><header class="top"><div class="brand"><i class="logo">▤</i>Практикум</div><div class="top-actions"><button class="secondary small" onclick="backup()">Скачать резервную копию</button> <button class="secondary small" onclick="document.getElementById('restore').click()">Загрузить копию</button><input id="restore" class="hide" type="file" accept="application/json" onchange="restore(this.files[0])"></div></header>
<div class="layout"><aside class="side"><h4>МОИ ГРУППЫ</h4><div id="groups"></div><div class="course"><b id="courseName">Базы данных</b><p>8 лабораторных<br>8 практических</p><b id="maxSide">48 баллов</b></div></aside><main class="main"><div class="title"><div><p id="breadcrumb">Базы данных / Группа 1</p><h1 id="pageTitle">Обзор семестра</h1></div><div class="tools-left"><button class="secondary" onclick="openImport()">⇩ Импорт КГЭУ</button><button onclick="openLesson()">＋ Добавить пару</button></div></div><nav class="tabs"><button class="tab active" data-tab="overview">Обзор</button><button class="tab" data-tab="lessons">Посещаемость</button><button class="tab" data-tab="works">Работы</button><button class="tab" data-tab="journal">Баллы</button><button class="tab" data-tab="students">Студенты</button></nav><div id="alert" class="alert"></div>
<section id="overview" class="view active"></section><section id="lessons" class="view"></section><section id="works" class="view"></section><section id="journal" class="view"></section><section id="students" class="view"></section></main></div>
<div id="modal" class="modal"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><form id="form"></form></div></div>
<script src="journal.js"></script><script src="adapter.js"></script><script src="journal-v1.3.js"></script><script src="excel-v1.4.js"></script></body></html>
